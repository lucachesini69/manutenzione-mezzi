<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Accedi - Gestione Manutenzione Mezzi</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔧</text></svg>">
    <style>
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 32px 28px;
            box-shadow: 0 6px 24px rgba(0,0,0,0.08);
        }
        .login-brand {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-brand .login-icon { font-size: 40px; }
        .login-brand h1 { font-size: 20px; margin: 8px 0 0; color: #222; }
        .login-field { margin-bottom: 16px; }
        .login-field label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 6px;
            color: #333;
        }
        .login-field input {
            width: 100%;
            box-sizing: border-box;
            font-size: 16px;
            min-height: 48px;
            padding: 12px 14px;
            border: 2px solid #007bff;
            border-radius: 8px;
            background: white;
            color: black;
            -webkit-appearance: none;
        }
        .login-btn {
            width: 100%;
            min-height: 48px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background: #007bff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 8px;
        }
        .login-btn:hover { background: #0069d9; }
        .login-flash {
            background: #ffe3e3;
            color: #b00020;
            border: 1px solid #ffbdbd;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-wrapper">
        <div class="login-card">
            <div class="login-brand">
                <div class="login-icon">🔧</div>
                <h1>Manutenzione Mezzi</h1>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="login-flash">{{ message }}</div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
                <div class="login-field">
                    <label for="username">Nome utente</label>
                    <input type="text" id="username" name="username" required autofocus
                           autocomplete="username" autocapitalize="none">
                </div>
                <div class="login-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required
                           autocomplete="current-password">
                </div>
                <button type="submit" class="login-btn">Accedi</button>
            </form>
        </div>
    </div>
</body>
</html>
