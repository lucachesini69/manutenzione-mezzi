# Blueprint Render per "Gestione Manutenzione Mezzi"
# Crea automaticamente il web service Flask + un database Postgres.
# Su Render: New -> Blueprint -> seleziona questo repository.

databases:
  - name: manutenzione-db
    databaseName: manutenzione
    plan: free
    region: frankfurt

services:
  - type: web
    name: manutenzione-mezzi
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: manutenzione-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.11.0"
      # Credenziali del primo utente amministratore (create solo al primo avvio,
      # quando il database non contiene ancora nessun utente). Render ti chiederà
      # di inserire questi valori durante il deploy del Blueprint.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
