# Configurazione Nginx come reverse proxy davanti a Gunicorn.
# Copia in: /etc/nginx/sites-available/manutenzione
# Attiva con: sudo ln -s /etc/nginx/sites-available/manutenzione /etc/nginx/sites-enabled/
# Poi: sudo nginx -t && sudo systemctl reload nginx
#
# Sostituisci "tuo-dominio.it" con il tuo dominio (o l'IP del server).
# Dopo aver avviato Nginx, esegui certbot per attivare l'HTTPS (vedi DEPLOY_HETZNER.md).

server {
    listen 80;
    server_name tuo-dominio.it www.tuo-dominio.it;

    # Dimensione massima delle richieste (es. per eventuali upload)
    client_max_body_size 10M;

    location / {
        proxy_pass http://unix:/run/manutenzione/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /static/ {
        alias /opt/manutenzione-mezzi/static/;
        expires 30d;
        access_log off;
    }
}
